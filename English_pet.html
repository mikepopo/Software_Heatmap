<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 养成</title>
<style>
:root{color-scheme:light dark;--ink:#2f3d52;--strong:#273245;--muted:#91a0b6;--line:#dce4ef;--surface:rgba(255,255,255,.96);--picker:#f2f5f9;--today:#243244;--empty-cell:#eef2f6;--partial-cell:#c9b8f5;--done-cell:#5530b0;--chip:#fff;--k:1.25;--ch:176px}
@media(prefers-color-scheme:dark){:root{--ink:#d8dee9;--strong:#f2f5f8;--muted:#9aa7ba;--line:#354255;--surface:rgba(24,29,37,.96);--picker:#273142;--today:#f2f5f8;--empty-cell:#293344;--partial-cell:#6e4fc4;--done-cell:#bba5ff;--chip:#1f2733}}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;overflow:hidden}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 2px rgba(31,45,61,.04);padding:12px 12px 12px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.yr{flex:0 1 auto;min-width:0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.week{display:flex;align-items:center;gap:5px;flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.week .lb{margin-right:2px;white-space:nowrap}.week .lb b{color:var(--strong)}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--empty-cell);transition:transform .2s}
.dot.on{background:var(--done-cell);color:#fff;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*60ms)}
.dot.part{background:var(--partial-cell);color:#fff}
.dot.future{background:transparent;box-shadow:inset 0 0 0 1.3px var(--line)}
.dot.now{outline:1.6px solid var(--today);outline-offset:1.5px;color:var(--strong)}
.dot.now.on{color:#fff}
.dot:hover{transform:translateY(-2px)}

/* 一行四只 */
.lines{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.line{min-width:0}
.t-fire{--c1:#ffd9b8;--c2:#ff9a4d;--c3:#e2622a;--glow:rgba(255,138,61,.42);--ray:rgba(255,196,92,.55);--hab:linear-gradient(#fff9f3,#ffe7d5);--floor:#ffd6bb;--tint:#fff1e6}
.t-grass{--c1:#d4f2c4;--c2:#7cc96a;--c3:#3f9440;--glow:rgba(118,205,96,.42);--ray:rgba(255,230,140,.6);--hab:linear-gradient(#f6fcf2,#dff3d5);--floor:#c8ebb6;--tint:#eef9e8}
.t-water{--c1:#c9f3ef;--c2:#3cc7c0;--c3:#12948f;--glow:rgba(60,200,190,.42);--ray:rgba(150,235,228,.6);--hab:linear-gradient(#f2fcfb,#d6f3f0);--floor:#bde9e4;--tint:#e8f8f6}
.t-volt{--c1:#d6e6ff;--c2:#7aa7ff;--c3:#4565d8;--glow:rgba(110,150,255,.45);--ray:rgba(255,226,110,.6);--hab:linear-gradient(#f5f8ff,#dde8ff);--floor:#ffffff;--tint:#edf3ff}
@media(prefers-color-scheme:dark){
  .t-fire{--hab:linear-gradient(#2c2420,#3d2a20);--floor:#4a3326;--tint:#33261f}
  .t-grass{--hab:linear-gradient(#202c24,#253a29);--floor:#2d4630;--tint:#223026}
  .t-water{--hab:linear-gradient(#1c2b2e,#1f3a3c);--floor:#2a4a4b;--tint:#1f3133}
  .t-volt{--hab:linear-gradient(#1f2638,#26324f);--floor:#33405f;--tint:#222b3d}}

.flip{position:relative;height:var(--ch);perspective:1100px}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.33,1.25,.5,1)}
.line.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:9px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;user-select:none;cursor:pointer}
.hab{background:var(--hab);isolation:isolate}
.hab .pet{cursor:grab}
.back{transform:rotateY(180deg);background:var(--hab);display:flex;flex-direction:column;padding:9px 10px 9px}
.back::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(40,60,90,.06);pointer-events:none}
.turn{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1;color:var(--c3);background:rgba(255,255,255,.82);opacity:.8;transition:transform .3s,opacity .2s}
.hab .turn{position:absolute;right:6px;bottom:6px;z-index:15}
.face:hover .turn{opacity:1;transform:rotate(180deg)}
.back .turn svg{transform:scaleX(-1)}
.bk-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.bk-tag{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;line-height:16px;font-weight:700;color:var(--c3);background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px}
.bk-tag b{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.back .row1{margin-top:7px}
.hab::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(40,60,90,.06);pointer-events:none;z-index:20}
.tag{position:absolute;top:6px;left:6px;z-index:15;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:16px;font-weight:700;color:var(--c3);background:rgba(255,255,255,.82);padding:1px 6px;border-radius:6px;white-space:nowrap}
.tag b{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.tag.pv{color:var(--strong)}
@media(prefers-color-scheme:dark){.tag,.bk-tag,.turn{background:rgba(10,14,22,.45);color:var(--c1)}}
.floor{position:absolute;left:-14%;right:-14%;bottom:-40px;height:66px;border-radius:50%;background:var(--floor);z-index:1}
.t-fire .floor{box-shadow:inset 0 8px 0 rgba(255,255,255,.35)}
.t-grass .floor{background:radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--floor) 55%,#7cc96a) 0 6px,transparent 7px) 0 0/13px 10px repeat-x,var(--floor)}
.t-water .floor{background:radial-gradient(circle at 50% 0,transparent 0 5px,color-mix(in srgb,var(--floor) 60%,#fff) 5.5px 7px,transparent 7.5px) 0 1px/15px 9px repeat-x,radial-gradient(circle at 30% 70%,color-mix(in srgb,var(--floor) 75%,#fff) 0 3px,transparent 3.5px) 0 0/23px 20px,var(--floor)}
.t-volt .floor{background:radial-gradient(circle at 12% 30%,var(--floor) 0 22px,transparent 23px),radial-gradient(circle at 32% 8%,var(--floor) 0 20px,transparent 21px),radial-gradient(circle at 70% 10%,var(--floor) 0 22px,transparent 23px),radial-gradient(circle at 88% 30%,var(--floor) 0 21px,transparent 22px),color-mix(in srgb,var(--floor) 70%,#c9dbff)}
.ground{position:absolute;left:50%;bottom:6px;width:var(--gw);height:10px;margin-left:calc(var(--gw)/-2);border-radius:50%;background:radial-gradient(closest-side,rgba(60,40,40,.22),transparent);z-index:2;animation:shadow 3.2s ease-in-out infinite}
.aura{position:absolute;left:50%;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);z-index:2;animation:breathe 3.2s ease-in-out infinite}
.rays{position:absolute;left:50%;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:repeating-conic-gradient(var(--ray) 0 8deg,transparent 8deg 22.5deg);-webkit-mask:radial-gradient(closest-side,#000 15%,transparent 78%);mask:radial-gradient(closest-side,#000 15%,transparent 78%);z-index:2;animation:spin 26s linear infinite}
.fx{position:absolute;inset:0;z-index:4;pointer-events:none}
.fx i{position:absolute;display:block;opacity:0;animation-duration:var(--du);animation-delay:var(--dl);animation-iteration-count:infinite}
.t-fire .fx i{bottom:12px;width:4px;height:4px;border-radius:50%;background:#ffb057;box-shadow:0 0 5px 1px rgba(255,130,40,.75);animation-name:rise;animation-timing-function:ease-in}
.t-fire .fx i:nth-child(3n){width:3px;height:3px;background:#ffd36b}
.t-grass .fx i{top:-8px;width:7px;height:5px;border-radius:0 100% 0 100%;background:#f6a7c3;animation-name:fall;animation-timing-function:linear}
.t-grass .fx i:nth-child(2n){background:#8fd17c;width:8px;height:4px}
.t-water .fx i{bottom:10px;width:7px;height:7px;border-radius:50%;border:1.3px solid rgba(40,170,180,.65);background:radial-gradient(circle at 34% 32%,rgba(255,255,255,.95) 0 1.4px,rgba(190,245,242,.35) 1.8px);animation-name:bubble;animation-timing-function:ease-in}
.t-water .fx i:nth-child(3n){width:5px;height:5px}
.t-water .fx i:nth-child(4n){width:9px;height:9px}
.t-volt .fx i{width:8px;height:11px;background:#ffd23d;clip-path:polygon(45% 0,100% 0,66% 38%,96% 38%,22% 100%,44% 56%,12% 56%);filter:drop-shadow(0 0 3px #ffe27a);animation-name:zap;animation-timing-function:steps(2)}
.t-volt .fx i:nth-child(2n){width:8px;height:8px;background:#9fc0ff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation-name:twinkle;animation-timing-function:ease-in-out}

/* 宠物 */
.pet{position:absolute;left:50%;bottom:10px;width:calc(var(--w)*var(--k));height:calc(var(--h)*var(--k));margin-left:calc(var(--w)*var(--k)/-2);z-index:5;transform-origin:50% 100%}
.pet .bob{position:absolute;inset:0;animation:float 3.2s ease-in-out infinite;transform-origin:50% 100%}
.pet.egg .bob{animation:wobble 3.4s ease-in-out infinite}
.sprite{position:absolute;inset:0;background:var(--img) center bottom/contain no-repeat}
.shine .sprite::after{content:"";position:absolute;inset:0;-webkit-mask:var(--img) center bottom/contain no-repeat;mask:var(--img) center bottom/contain no-repeat;background:linear-gradient(110deg,transparent 45%,rgba(255,255,255,.6) 50%,transparent 55%) 0 0/250% 100% no-repeat;background-position:100% 0;animation:shine 5.5s ease-in-out infinite;animation-delay:calc(2.2s + var(--sd,0s))}
.pet.reveal .sprite{animation:reveal 1.35s ease-out both;animation-delay:var(--d,0s)}
.pet.pop{animation:popin .55s cubic-bezier(.3,1.6,.5,1)}
.pet.jump{animation:jump .6s cubic-bezier(.3,1.5,.5,1)}
.heart{position:absolute;font-size:13px;font-weight:800;color:var(--c3);pointer-events:none;animation:up 1s ease-out forwards;z-index:16}

/* 进化动画 */
.seq{position:absolute;inset:0;z-index:12;pointer-events:none}
.seq .dim{position:absolute;inset:0;background:rgba(18,22,34,.62);animation:fadein .35s both}
.seq .pet .bob{animation:none}
.sil{position:absolute;left:50%;bottom:10px;width:calc(var(--w)*var(--k));height:calc(var(--h)*var(--k));margin-left:calc(var(--w)*var(--k)/-2);filter:drop-shadow(0 0 6px var(--c2)) drop-shadow(0 0 2px #fff);opacity:0}
.sil i{position:absolute;inset:0;background:#fff;-webkit-mask:var(--img) center bottom/contain no-repeat;mask:var(--img) center bottom/contain no-repeat}
.sil.on{opacity:1}
.flash{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 58%,#fff 0,rgba(255,255,255,.95) 28%,rgba(255,255,255,0) 70%);z-index:13;pointer-events:none;animation:flash .9s ease-out forwards}
.ring{position:absolute;left:50%;width:20px;height:20px;margin:0 0 -10px -10px;border-radius:50%;border:3px solid var(--c2);box-shadow:0 0 10px var(--glow);z-index:11;pointer-events:none;animation:ring .9s ease-out forwards}
.bit{position:absolute;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c2);box-shadow:0 0 6px var(--glow);z-index:11;pointer-events:none;animation:fly .95s cubic-bezier(.2,.7,.4,1) forwards}
.toast{position:absolute;left:50%;bottom:6px;z-index:16;max-width:94%;overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--c3);font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 10px rgba(30,40,60,.12);animation:toast 3.4s ease forwards;pointer-events:none}

/* 信息 */
.row1{display:flex;align-items:center;gap:6px;min-width:0}
.row1 b{min-width:0;font-size:14.5px;line-height:1.25;color:var(--strong);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{flex:0 0 auto;font-size:10.5px;line-height:15px;font-weight:800;color:#fff;background:var(--c3);padding:0 6px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lv.pv{background:var(--muted)}
.xp{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:6px}
.xp i{height:6px;border-radius:2px;background:var(--empty-cell)}
.xp i.on{background:var(--c3);animation:pop .4s ease-out both;animation-delay:calc(.5s + var(--i)*50ms)}
.next{font-size:11.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next b{color:var(--c3)}
.next.hl{animation:nudge .5s}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-top:auto;padding-top:6px;max-width:156px}
.evo{min-width:0;cursor:pointer;animation:pop .45s ease-out both;animation-delay:calc(.25s + var(--i)*40ms)}
.th{position:relative;aspect-ratio:1;border-radius:5px;background:var(--empty-cell);transition:transform .18s;overflow:hidden}
.th .img{position:absolute;inset:1.5px;background:var(--img) center/contain no-repeat}
.evo.done .th{background:var(--tint)}
.evo.cur .th{background:var(--tint);box-shadow:inset 0 0 0 1.6px var(--c3),0 0 8px var(--glow)}
.evo.nx .th{box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--c2) 45%,transparent)}
.evo.view .th{box-shadow:inset 0 0 0 1.6px var(--c2)}
.evo.lock .th .img{filter:brightness(0) opacity(.16)}
@media(prefers-color-scheme:dark){.evo.lock .th .img{filter:brightness(0) invert(1) opacity(.14)}}
.evo:hover .th{transform:translateY(-2px)}
.evo.shake{animation:shake .4s}

@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.84);opacity:.7}}
@keyframes wobble{0%,52%,100%{transform:rotate(0)}60%{transform:rotate(-7deg)}68%{transform:rotate(6deg)}76%{transform:rotate(-4deg)}84%{transform:rotate(2deg)}}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.06);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%{background-position:100% 0}35%,100%{background-position:0 0}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-95px) scale(1.1);opacity:0}}
@keyframes bubble{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.95}50%{transform:translate(4px,-48px) scale(.9)}100%{transform:translate(-3px,-98px) scale(1.15);opacity:0}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(26px,140px) rotate(320deg);opacity:0}}
@keyframes zap{0%,100%{opacity:0}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes reveal{0%{filter:brightness(0) opacity(.15);transform:scale(.86)}45%{filter:brightness(0) opacity(.75);transform:scale(.95)}58%{filter:brightness(2.8);transform:scale(1.07)}75%{filter:brightness(1.3)}100%{filter:none;transform:scale(1)}}
@keyframes popin{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(2px) scale(1.06,.92)}60%{transform:translateY(-15px) scale(.97,1.05)}100%{transform:translateY(0) scale(1)}}
@keyframes up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes fadein{from{opacity:0}}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(8);opacity:0}}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.still *,.still *::before,.still *::after{animation:none!important}
.still .fx i{opacity:.8;transform:translateY(var(--y))}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
@media(max-width:680px){.lines{gap:7px}.card{padding:10px 9px}.tag,.bk-tag{font-size:10px;padding:1px 5px}.tag b,.bk-tag b{font-size:11px}.back{padding:8px 8px}.row1{gap:4px}.row1 b{font-size:13.5px}.next{font-size:11px}}
@media(max-width:560px){:root{--k:.55;--ch:88px}.back{justify-content:space-between}.lines{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:9px 8px}.top{margin-bottom:8px}.tag{top:4px;left:4px}.hab .turn{right:4px;bottom:4px;width:16px;height:16px;font-size:11px}.back{padding:6px 8px 7px}.back .row1,.xp,.next{margin-top:0!important}.row1 b{font-size:13px}.xp{margin-top:4px;gap:2px}.xp i{height:5px}.next{font-size:10px;margin-top:3px}.chain{display:none}.toast{font-size:10px}}
@media(max-width:360px){.week .lb,.yr{display:none}.week{gap:4px}.dot{width:19px;height:19px}}

<main class="card" id="root">

<script>
/* 本页不用手动修改：全部自动读取同一文件夹里 English_heatmap.html 的
   WORD_DATES（单词）和 LISTENING_DATES（听力）。按自然年统计，每年 1 月 1 日重新孵化，一年最多 300 天。
   🔥 单词打卡天数  💧 听力打卡天数  🌿 双修（同一天单词+听力都完成）天数  ⚡ 最长连续打卡天数 */
const HEATMAP_FILE = "./English_heatmap.html";
const MAX_DAYS = 300;
const DAY_STAGES = [0, 1, 7, 30, 60, 100, 200, 300], STREAK_STAGES = [0, 1, 3, 7, 14, 30, 60, 100];
const mk = (mins, names) => mins.map((m, k) => [m, names[k]]);
const TURN = `<svg viewBox="-1 -1 26 26" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`;
const LINES = [
  { id: "fire", key: "word", cls: "t-fire", icon: "🔥", kind: "单词打卡", unit: "天", tagUnit: "天", verb: "再背", need: "单词打卡", yearly: true,
    stages: mk(DAY_STAGES, ["火之蛋", "焰崽", "小焰狐", "火尾狐", "炎鬃兽", "炎翼兽", "炎铠龙王", "炎阳神帝"]) },
  { id: "water", key: "listen", cls: "t-water", icon: "💧", kind: "听力打卡", unit: "天", tagUnit: "天", verb: "再听", need: "听力打卡", yearly: true,
    stages: mk(DAY_STAGES, ["水之蛋", "泡泡獭", "浪尾獭", "海灵狐", "潮鬃兽", "澜翼兽", "沧澜龙王", "沧海神皇"]) },
  { id: "grass", key: "both", cls: "t-grass", icon: "🌿", kind: "双修", unit: "天", tagUnit: "天", verb: "再双修", need: "双修", yearly: true,
    stages: mk(DAY_STAGES, ["草之蛋", "芽芽兔", "小鹿兔", "花环鹿", "樱角鹿", "森灵鹿", "翠翼鹿王", "世界树神"]) },
  { id: "thunder", key: "streak", cls: "t-volt", icon: "⚡", kind: "最长连续", unit: "天", tagUnit: "天", verb: "再连续", need: "最长连续", yearly: true,
    stages: mk(STREAK_STAGES, ["雷之蛋", "雷喵崽", "闪尾喵", "角雷狼", "雷翼狼", "暴雷兽", "雷铠狼王", "天雷神尊"]) },
];
const SIZE = {"fire0":[54,58],"fire1":[41,52],"fire2":[55,60],"fire3":[63,68],"fire4":[77,76],"fire5":[66,84],"fire6":[88,90],"fire7":[85,96],"grass0":[42,58],"grass1":[42,52],"grass2":[47,60],"grass3":[39,68],"grass4":[55,76],"grass5":[68,84],"grass6":[62,90],"grass7":[69,96],"thunder0":[50,58],"thunder1":[49,52],"thunder2":[52,60],"thunder3":[59,68],"thunder4":[65,76],"thunder5":[78,84],"thunder6":[69,90],"thunder7":[84,96],"water0":[53,58],"water1":[47,52],"water2":[61,60],"water3":[46,68],"water4":[65,76],"water5":[66,84],"water6":[65,90],"water7":[80,96]};

const q = new URLSearchParams(location.search), still = q.has("still");
if (still) document.getElementById("root").classList.add("still");
const pad = n => String(n).padStart(2, "0"), ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = new Date(); today.setHours(0, 0, 0, 0);
const $ = id => document.getElementById(id);
const K = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--k")) || 1;
const stageOf = (st, v) => st.reduce((s, [min], k) => v >= min ? k : s, 0);

function petHTML(id, s, extra = "") {
  const [w, h] = SIZE[id + s];
  return `<div class="pet${s ? "" : " egg"}${s >= 5 ? " shine" : ""} ${extra}" style="--w:${w}px;--h:${h}px"><div class="bob"><div class="sprite a-${id}${s}"></div></div></div>`;
}
function backHTML(id, s) {
  const k = K(), [w, h] = SIZE[id + s], cy = 10 + h * k * 0.52;
  let out = `<div class="ground" style="--gw:${Math.round(Math.min(w, 100) * k * 0.72)}px"></div>`;
  if (s >= 3) { const a = Math.round(h * k * 1.3); out += `<div class="aura" style="width:${a}px;height:${a}px;margin-left:${-a / 2}px;bottom:${Math.round(cy - a / 2)}px"></div>`; }
  if (s === 7) out += `<div class="rays" style="bottom:${Math.round(cy - 120)}px"></div>`;
  return out;
}
function fxHTML(id, s) {
  return Array.from({ length: 4 + Math.ceil(s / 2) }, (_, k) => {
    const left = 6 + (k * 37 + s * 13) % 88, dl = ((k * 0.61) % 3.4).toFixed(2);
    const du = (id === "grass" ? 4.5 + (k * 0.7) % 2.5 : id === "water" ? 3.4 + (k * 0.53) % 1.8 : 2.4 + (k * 0.43) % 1.6).toFixed(2);
    const y = id === "fire" || id === "water" ? -(10 + (k * 29) % 70) : id === "grass" ? 24 + (k * 41) % 90 : 0;
    const top = id === "thunder" ? `;top:${22 + (k * 23) % 50}%` : "";
    return `<i style="left:${left}%;--dl:${dl}s;--du:${du}s;--y:${y}px${top}"></i>`;
  }).join("");
}

function render(L, v, i, mem, newYear) {
  const st = L.stages, s = stageOf(st, v), next = st[s + 1], base = st[s][0];
  const filled = next ? Math.floor((v - base) / (next[0] - base) * 10) : 10;
  const chain = st.map(([min, name], k) => {
    const cls = k < s ? "done" : k === s ? "cur" : "lock";
    const tip = k > s ? `Lv.${k + 1} ？？？（需要${L.need} ${min} ${L.unit}）` : `Lv.${k + 1} ${name}（${min} ${L.unit}）`;
    return `<div class="evo ${cls}${k === s + 1 ? " nx" : ""}" data-k="${k}" style="--i:${k}" title="${tip}"><div class="th"><div class="img a-${L.id}${k}"></div></div></div>`;
  }).join("");
  const tagTip = L.yearly ? `${L.kind} ${v} 天（${today.getFullYear()} 年，最多 ${MAX_DAYS} 天，每年 1 月 1 日重置）` : `${L.kind} ${v} ${L.tagUnit}`;
  const el = document.createElement("section");
  el.className = "line " + L.cls; el.style.setProperty("--sd", i * 0.8 + "s");
  const tagHTML = `${L.icon} ${L.kind} <b>${v}</b> ${L.tagUnit}`;
  el.innerHTML = `
    <div class="flip"><div class="inner">
      <div class="face hab" title="点宠物和它互动 · 点空白处翻到背面看详情"><span class="tag" title="${tagTip}">${tagHTML}</span><span class="turn">${TURN}</span>
        <div class="floor"></div><div class="stagebg">${backHTML(L.id, s)}</div><div class="fx">${fxHTML(L.id, s)}</div>${petHTML(L.id, s)}</div>
      <div class="face back" title="点空白处或移开鼠标，翻回正面">
        <div class="bk-top"><span class="bk-tag" title="${tagTip}">${tagHTML}</span><span class="turn">${TURN}</span></div>
        <div class="row1"><b class="nm">${st[s][1]}</b><span class="lv">Lv.${s + 1}</span></div>
        <div class="xp">${Array.from({ length: 10 }, (_, k) => `<i class="${k < filled ? "on" : ""}" style="--i:${k}"></i>`).join("")}</div>
        <div class="next" title="${next ? `${L.verb} ${next[0] - v} ${L.unit}进化为「${next[1]}」` : L.yearly ? `今年已满 ${MAX_DAYS} 天，明年 1 月 1 日重新孵化` : "已达最终形态"}">${next ? `${L.verb} <b>${next[0] - v} ${L.unit}</b> → ${next[1]}` : `<b>满级啦 🎉 最终形态</b>`}</div>
        <div class="chain">${chain}</div>
      </div>
    </div></div>`;
  $("lines").appendChild(el);

  const hab = el.querySelector(".hab"), tagEl = hab.querySelector(".tag"), back = el.querySelector(".back"), lvb = el.querySelector(".lv"), nm = el.querySelector(".nm");
  let shown = s, timer = 0;
  const flip = on => el.classList.toggle("flipped", on);
  // 翻到背面后，鼠标离开这张卡片就自动翻回正面（移回来得快就不翻）
  let leaveT = 0;
  el.addEventListener("mouseleave", () => { clearTimeout(leaveT); leaveT = setTimeout(() => flip(false), 180); });
  el.addEventListener("mouseenter", () => clearTimeout(leaveT));
  const show = (k, preview) => {
    hab.querySelector(".pet").remove();
    hab.querySelector(".stagebg").innerHTML = backHTML(L.id, k);
    hab.insertAdjacentHTML("beforeend", petHTML(L.id, k, still ? "" : "pop"));
    nm.textContent = st[k][1];
    tagEl.innerHTML = preview ? `👀 预览 Lv.${k + 1} ${st[k][1]}` : tagHTML; tagEl.classList.toggle("pv", !!preview);
    lvb.textContent = `Lv.${k + 1}${preview ? " 预览" : ""}`; lvb.classList.toggle("pv", !!preview);
    el.querySelectorAll(".evo").forEach(c => c.classList.toggle("view", preview && +c.dataset.k === k));
    shown = k;
  };
  // 背面：点进化链里已解锁的形态 → 翻回正面预览 3.5 秒；点未解锁的会抖一下；点其他地方翻回正面
  back.addEventListener("click", e => {
    const c = e.target.closest(".evo");
    if (!c) { flip(false); return; }
    const k = +c.dataset.k;
    if (k > s) {
      c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
      const n = el.querySelector(".next"); n.classList.remove("hl"); void n.offsetWidth; n.classList.add("hl");
      return;
    }
    clearTimeout(timer); flip(false);
    show(k, k !== s);
    if (k !== s) timer = setTimeout(() => show(s, false), 3500);
  });
  const jump = () => {
    const p = hab.querySelector(".pet"); if (!p || still || p.classList.contains("jump")) return;
    p.classList.remove("pop"); void p.offsetWidth; p.classList.add("jump");
    p.addEventListener("animationend", e => { if (e.animationName === "jump") p.classList.remove("jump"); }, { once: true });
  };
  hab.addEventListener("pointerover", e => { const p = e.target.closest(".pet"); if (p && !p.contains(e.relatedTarget)) jump(); });
  // 正面：点宠物 → 跳一下冒爱心；点空白处 → 翻到背面
  hab.addEventListener("click", e => {
    if (!e.target.closest(".pet")) { flip(true); return; }
    jump();
    const h = document.createElement("span"); h.className = "heart";
    h.textContent = ["❤", "♪", "+1", "✦"][Math.floor(Math.random() * 4)];
    const r = hab.getBoundingClientRect(); h.style.left = (e.clientX - r.left) + "px"; h.style.top = (e.clientY - r.top - 12) + "px";
    hab.appendChild(h); setTimeout(() => h.remove(), 1000);
  });

  // 进化判定：和上次打开时比较，阶段升高就播放完整进化动画；跨年时累计天数清零，重新孵化
  const prev = mem[L.id], force = q.has("evolve") && s > 0;
  mem[L.id] = s;
  if (still) return;
  if (force || (prev !== undefined && s > prev && !(L.yearly && newYear))) evolve(hab, L, force ? s - 1 : prev, s, 0.4 + i * 0.5);
  else {
    const p = hab.querySelector(".pet");
    if (s > 0) { p.style.setProperty("--d", (0.25 + i * 0.3) + "s"); p.classList.add("reveal"); }
    if (L.yearly && newYear && prev !== undefined && prev > 0) toast(hab, "🎆 新的一年，重新孵化", 0.8 + i * 0.3);
  }
}

function toast(hab, text, delay = 0) {
  setTimeout(() => { const t = document.createElement("div"); t.className = "toast"; t.textContent = text; hab.appendChild(t); setTimeout(() => t.remove(), 3500); }, delay * 1000);
}

async function evolve(hab, L, from, to, delay) {
  const pet = hab.querySelector(".pet"); pet.style.visibility = "hidden";
  const [w0, h0] = SIZE[L.id + from], [w1, h1] = SIZE[L.id + to];
  const seq = document.createElement("div"); seq.className = "seq";
  seq.innerHTML = petHTML(L.id, from) +
    `<div class="sil" style="--w:${w0}px;--h:${h0}px"><i class="a-${L.id}${from}"></i></div><div class="sil" style="--w:${w1}px;--h:${h1}px"><i class="a-${L.id}${to}"></i></div>`;
  hab.appendChild(seq);
  await sleep(delay * 1000 + 700);
  const [a, b] = seq.querySelectorAll(".sil"), old = seq.querySelector(".pet");
  seq.insertAdjacentHTML("afterbegin", `<div class="dim"></div>`);
  old.style.transition = "opacity .3s"; old.style.opacity = 0; a.classList.add("on");
  await sleep(450);
  for (const ms of [300, 260, 220, 190, 160, 135, 115, 95, 80, 68, 58, 50, 44, 40, 40, 40]) {
    a.classList.toggle("on"); b.classList.toggle("on"); await sleep(ms);
  }
  a.classList.remove("on"); b.classList.add("on");
  await sleep(220);
  const cy = 10 + h1 * K() * 0.52;
  hab.insertAdjacentHTML("beforeend", `<div class="flash"></div><div class="ring" style="bottom:${cy}px"></div>` +
    Array.from({ length: 12 }, (_, k) => { const ang = k / 12 * Math.PI * 2, r = 50 + (k % 3) * 14;
      return `<i class="bit" style="bottom:${cy}px;--dx:${Math.round(Math.cos(ang) * r)}px;--dy:${Math.round(Math.sin(ang) * r)}px"></i>`; }).join(""));
  await sleep(160);
  seq.remove(); pet.style.visibility = ""; pet.classList.add("pop");
  toast(hab, `✨ 进化成 ${L.stages[to][1]}！`, 0.15);
  setTimeout(() => hab.querySelectorAll(".flash,.ring,.bit").forEach(x => x.remove()), 1100);
}

async function getDates() {
  try {
    const h = await fetch(HEATMAP_FILE + "?t=" + Date.now()).then(r => r.text());
    const grab = name => { try { const m = h.match(new RegExp(name + "\\s*=\\s*(\\[[\\s\\S]*?\\])")); return m ? JSON.parse(m[1].replace(/\/\/.*$/gm, "").replace(/'/g, '"').replace(/,\s*\]/, "]")) : []; } catch (e) { return []; } };
    return { done: grab("WORD_DATES"), part: grab("WORD_PARTIAL_DATES"), practice: grab("LISTENING_DATES") };
  } catch (e) {}
  return { done: [], part: [], practice: [] };
}

(async () => {
  const { done, part, practice: extra } = await getDates();
  const practiceDates = extra;
  const Y = today.getFullYear(), T = ymd(today);
  const yearCount = arr => Math.min(MAX_DAYS, new Set(arr.map(String).filter(d => d.slice(0, 4) === String(Y) && d <= T)).size);
  const set = new Set(done), pset = new Set(part), prset = new Set(practiceDates), any = k => set.has(k) || prset.has(k);
  const mon = addDays(today, -((today.getDay() + 6) % 7)); let n = 0;
  const dots = "一二三四五六日".split("").map((w, i) => {
    const d = addDays(mon, i), k = ymd(d), on = any(k), now = +d === +today; if (on) n++;
    const cls = ["dot", on ? "on" : pset.has(k) ? "part" : "", d > today ? "future" : "", now ? "now" : ""].join(" ");
    const tip = [set.has(k) ? "✓ 单词" : pset.has(k) ? "◐ 单词部分完成" : "", prset.has(k) ? "✓ 听力" : ""].filter(Boolean).join(" · ");
    return `<span class="${cls}" style="--i:${i}" title="周${w} ${k}${tip ? " " + tip : ""}">${w}</span>`;
  }).join("");
  $("week").innerHTML = `<span class="lb">本周打卡 <b>${n}</b>/7</span>${dots}`;
  $("yr").textContent = `${Y} 年度`;
  $("yr").title = `单词、听力、双修、最长连续都按自然年统计：每年 1 月 1 日清零重新孵化，一年最多 ${MAX_DAYS} 天。`;
  const inY = d => d.slice(0, 4) === String(Y) && d <= T;
  const both = [...set].filter(d => prset.has(d));
  let best = 0, run = 0;
  for (let d = new Date(Y, 0, 1); +d <= +today; d = addDays(d, 1)) { run = any(ymd(d)) ? run + 1 : 0; if (run > best) best = run; }
  const v = { word: yearCount(done), listen: yearCount(practiceDates), both: yearCount(both), streak: Math.min(MAX_DAYS, best) };
  const demo = q.get("demo");
  if (demo) {
    const [a, b, c, d] = demo.split(",").map(Number);
    Object.assign(v, { word: Math.min(MAX_DAYS, a || 0), listen: Math.min(MAX_DAYS, b || 0), both: Math.min(MAX_DAYS, c || 0), streak: Math.min(MAX_DAYS, d || 0) });
  }
  let mem = {};
  try { mem = JSON.parse(localStorage.getItem("en-grow-stage") || "{}") || {}; } catch (e) {}
  const newYear = mem.year !== undefined && mem.year !== Y;
  LINES.forEach((L, i) => render(L, v[L.key], i, mem, newYear));
  document.documentElement.addEventListener("mouseleave", () => document.querySelectorAll(".line.flipped").forEach(l => l.classList.remove("flipped")));
  mem.year = Y;
  if (!demo) try { localStorage.setItem("en-grow-stage", JSON.stringify(mem)); } catch (e) {}
})();
</script>
