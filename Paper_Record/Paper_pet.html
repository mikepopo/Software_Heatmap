<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文伙伴</title>
<style>
:root{color-scheme:light dark;--ink:#2f3d52;--strong:#273245;--muted:#91a0b6;--line:#dce4ef;--surface:rgba(255,255,255,.96);--chip:#f2f5f9;--chip2:#e6ebf2;
 --t:#12948c;--t2:#0b6f69;--tl:#a9e0d9;--tbg:#e8f6f4;--gold:#d9a521;--warm:#e8590c}
@media(prefers-color-scheme:dark){:root{--ink:#d8dee9;--strong:#f2f5f8;--muted:#9aa7ba;--line:#354255;--surface:rgba(24,29,37,.96);--chip:#273142;--chip2:#323d50;
 --t:#3cc4b8;--t2:#6fdcd1;--tl:#1d5752;--tbg:rgba(60,196,184,.10);--gold:#f0c24b;--warm:#ff8a4c}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:hidden;box-shadow:0 1px 2px rgba(31,45,61,.04)}
.top{display:flex;align-items:center;gap:10px;min-width:0}
h1{margin:0;font-size:18px;font-weight:800;color:var(--strong);white-space:nowrap;letter-spacing:.2px}
.meta{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}.meta b{color:var(--strong);font-size:14px}
.toast{position:absolute;z-index:20;left:50%;top:10px;transform:translate(-50%,-34px);background:var(--strong);color:var(--surface);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transition:all .45s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){h1{font-size:15.5px}.card{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--empty:#eef2f6;--ch:178px}
@media(prefers-color-scheme:dark){:root{--empty:#293344}}
.t-owl{--c1:#d3f0ec;--c2:#5cc4b8;--c3:#12948c;--glow:rgba(60,196,184,.36);--hab:linear-gradient(#f6fcfb,#ddf1ee);--floor:#c6e6e1;--tint:#eaf7f5}
@media(prefers-color-scheme:dark){.t-owl{--c3:#3cc4b8;--hab:linear-gradient(#17252a,#1e3437);--floor:#284649;--tint:#1c2f32}}
@media(prefers-color-scheme:dark){.floor{box-shadow:inset 0 6px 0 rgba(255,255,255,.07)}}
.s7{--glow:rgba(70,225,215,.5)}
.card{border-radius:9px;padding:12px}
.top{justify-content:space-between;margin-bottom:10px}
.week{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.week .lb{margin-right:2px;white-space:nowrap}.week .lb b{color:var(--strong)}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--empty)}
.dot.on{background:var(--c3);color:#fff;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*60ms)}
.dot.fu{background:transparent;box-shadow:inset 0 0 0 1.3px var(--line)}
.dot.now{outline:1.6px solid var(--strong);outline-offset:1.5px;color:var(--strong)}.dot.now.on{color:#fff}
.yr{font-size:11.5px;color:var(--muted);white-space:nowrap}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}
.tile{position:relative;height:var(--ch);border-radius:9px;overflow:hidden;background:var(--hab)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(40,60,90,.06);pointer-events:none;z-index:20}
.info{display:flex;flex-direction:column;padding:9px 10px}
.bk-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pill{font-size:11px;line-height:16px;font-weight:700;color:var(--c3);background:rgba(255,255,255,.75);padding:1px 6px;border-radius:6px;white-space:nowrap}
.pill b{font-size:12px;font-weight:800}
@media(prefers-color-scheme:dark){.pill,.tag{background:rgba(10,14,22,.45)!important;color:var(--c1)!important}}
.row1{display:flex;align-items:center;gap:6px;margin-top:7px;min-width:0}
.row1 b{font-size:16px;font-weight:800;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-size:10.5px;line-height:15px;font-weight:800;color:#fff;background:var(--c3);padding:0 6px;border-radius:999px}
@media(prefers-color-scheme:dark){.lv{color:#0e2a28}}
.xp{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:7px}
.xp i{height:6px;border-radius:2px;background:var(--empty)}
.xp i.on{background:var(--c3);animation:pop .4s ease-out both;animation-delay:calc(.4s + var(--i)*50ms)}
.next{font-size:11.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next b{color:var(--c3)}
.mood{margin-top:5px;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-top:auto;padding-top:6px}
.evo{min-width:0;animation:pop .45s ease-out both;animation-delay:calc(.25s + var(--i)*40ms)}
.th{position:relative;aspect-ratio:1;border-radius:5px;background:var(--empty);overflow:hidden;transition:transform .18s}
.th .img{position:absolute;inset:1.5px;background:var(--img) center/contain no-repeat}
.evo.done .th{background:var(--tint)}
.evo.cur .th{background:var(--tint);box-shadow:inset 0 0 0 1.6px var(--c3),0 0 8px var(--glow)}
.evo.nx .th{box-shadow:inset 0 0 0 1.2px var(--c2)}
.evo.lock .th .img{filter:brightness(0) opacity(.16)}
@media(prefers-color-scheme:dark){.evo.lock .th .img{filter:brightness(0) invert(1) opacity(.14)}}
.evo:hover .th{transform:translateY(-2px)}
.hab{isolation:isolate}
.tag{position:absolute;top:6px;left:6px;z-index:15;font-size:11px;line-height:16px;font-weight:700;color:var(--c3);background:rgba(255,255,255,.82);padding:1px 6px;border-radius:6px;white-space:nowrap}
.tag b{font-size:12px;font-weight:800}
.moon{position:absolute;right:16px;top:12px;width:18px;height:18px;border-radius:50%;background:#fff1c9;box-shadow:0 0 14px 3px rgba(255,226,160,.55),inset -5px -2px 0 #ecd9a6;z-index:1}
.floor{position:absolute;left:-14%;right:-14%;bottom:-40px;height:66px;border-radius:50%;background:var(--floor);z-index:1;box-shadow:inset 0 8px 0 rgba(255,255,255,.3)}
.aura{position:absolute;left:50%;bottom:8px;width:170px;height:150px;margin-left:-85px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);z-index:2;animation:breathe 3.2s ease-in-out infinite}
.ground{position:absolute;left:50%;bottom:6px;width:var(--gw);height:10px;margin-left:calc(var(--gw)/-2);border-radius:50%;background:radial-gradient(closest-side,rgba(20,60,60,.22),transparent);z-index:2;animation:shadow 3.2s ease-in-out infinite}
.fx{position:absolute;inset:0;z-index:4;pointer-events:none}
.fx i{position:absolute;width:8px;height:8px;background:#e8b45a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 3px #ffd98a);opacity:0;animation:twinkle var(--du) ease-in-out var(--dl) infinite}
.fx i:nth-child(3n){width:5px;height:5px;background:#fff3cf}
.pet{position:absolute;left:50%;bottom:10px;width:calc(var(--w)*1px);height:calc(var(--h)*1px);margin-left:calc(var(--w)*-.5px);z-index:5;transform-origin:50% 100%;cursor:pointer}
.bob{position:absolute;inset:0;animation:float 3.2s ease-in-out infinite;transform-origin:50% 100%}
.s0 .bob{animation:wobble 3.4s ease-in-out infinite}
.sprite{position:absolute;inset:0;background:var(--img) center bottom/contain no-repeat}
.pet.jump{animation:jump .6s cubic-bezier(.3,1.5,.5,1)}
.zzz{position:absolute;z-index:8;left:calc(50% + 20px);top:30px;display:none;font-weight:800;color:#3f7d77;pointer-events:none}
@media(prefers-color-scheme:dark){.zzz{color:#a9e0d9}}
.sleep .zzz,.drowsy .zzz{display:block}.drowsy .zzz i:nth-child(n+2){display:none}
.zzz i{position:absolute;font-style:normal;opacity:0;animation:z 3.3s ease-in infinite}
.zzz i:nth-child(1){font-size:12px}.zzz i:nth-child(2){font-size:16px;animation-delay:1.1s}.zzz i:nth-child(3){font-size:20px;animation-delay:2.2s}
.dim{position:absolute;inset:0;z-index:7;pointer-events:none;background:rgba(30,24,40,0);transition:background .8s}
.sleep .dim{background:rgba(30,24,40,.26)}.drowsy .dim{background:rgba(30,24,40,.10)}
.sleep .fx,.sleep .aura,.drowsy .fx{display:none}
.sleep .bob{animation:breathe2 4.4s ease-in-out infinite}
.sleep .sprite{filter:saturate(.7) brightness(.92)}
.flash{position:absolute;inset:-20%;z-index:13;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 58%,#fff 0,rgba(255,255,255,.95) 28%,rgba(255,255,255,0) 70%)}
.evolve .flash{animation:flash 1.6s ease-out}
.evolve .pet .sprite{animation:reveal 1.6s ease-out both}
.toast{top:auto;bottom:6px;transform:translate(-50%,30px);font-size:11px;padding:3px 9px;background:rgba(255,255,255,.92);color:var(--c3);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.toast.show{transform:translate(-50%,0)}
@media(prefers-color-scheme:dark){.toast{background:rgba(10,14,22,.8);color:var(--c1)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.84);opacity:.7}}
@keyframes wobble{0%,52%,100%{transform:rotate(0)}60%{transform:rotate(-7deg)}68%{transform:rotate(6deg)}76%{transform:rotate(-4deg)}84%{transform:rotate(2deg)}}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.06);opacity:1}}
@keyframes breathe2{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.97)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes z{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(26px,-40px);opacity:0}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(2px) scale(1.06,.92)}60%{transform:translateY(-15px) scale(.97,1.05)}100%{transform:translateY(0) scale(1)}}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@keyframes reveal{0%{filter:brightness(0) opacity(.15);transform:scale(.86)}45%{filter:brightness(0) opacity(.75);transform:scale(.95)}58%{filter:brightness(2.8);transform:scale(1.07)}75%{filter:brightness(1.3)}100%{filter:none;transform:scale(1)}}
@media(max-width:480px){.duo{grid-template-columns:1fr}.info{order:2;height:auto;min-height:150px}.week .lb{display:none}}
</style></head>
<body>
<main class="card t-owl" id="root">
 <div class="top"><div class="week" id="week"></div><div class="yr">🦉 论文伙伴</div></div>
 <div class="duo">
  <section class="tile info">
   <div class="bk-top"><span class="pill">📚 已读 <b id="nread">0</b> 篇</span><span class="pill" id="streak"></span></div>
   <div class="row1"><b id="nm"></b><span class="lv" id="lv"></span></div>
   <div class="xp" id="xp"></div>
   <div class="next" id="next"></div>
   <div class="mood" id="mood"></div>
   <div class="chain" id="chain"></div>
  </section>
  <section class="tile hab" id="hab">
   <span class="tag" id="tag"></span><div class="moon"></div><div class="fx" id="fx"></div><div class="floor"></div><div class="aura"></div><div class="ground" id="ground"></div>
   <div class="pet" id="pet"><div class="bob"><div class="sprite" id="sprite"></div></div></div>
   <div class="zzz"><i>z</i><i>z</i><i>Z</i></div><div class="dim"></div><div class="flash"></div>
   <div class="toast" id="toast"></div>
  </section>
 </div>
</main>
<script>
/* ---------- 公共：自动读取上一级文件夹（仓库根目录）里的 Paper_shelf.html（PAPERS、TO_READ）和 Paper_heatmap.html（READ_DATES） ---------- */
const DATA_DIR = "../";   // 数据文件相对本文件的位置
const Q = new URLSearchParams(location.search), STILL = Q.has("still");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const isD = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const hashS = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function grabArr(src, name) {
  const m = (src || "").match(new RegExp("const\\s+" + name + "\\s*=\\s*\\[([\\s\\S]*?)\\]\\s*;"));
  if (!m) return [];
  try { return Function("return [" + m[1] + "]")() || []; } catch (e) { return []; }
}
function buildData(papers, extra, toRead) {
  papers = (papers || []).filter(p => p && p.title).map((p, i) => ({ title: String(p.title), date: isD(p.date) ? p.date : "", pdf: p.pdf || "", i }));
  papers.sort((a, b) => (a.date || "0") < (b.date || "0") ? -1 : (a.date || "0") > (b.date || "0") ? 1 : a.i - b.i);
  const perDay = {};
  papers.forEach(p => { if (p.date) perDay[p.date] = (perDay[p.date] || 0) + 1; });
  let extraN = 0;
  (extra || []).forEach(d => { if (isD(d) && !perDay[d]) { perDay[d] = 1; extraN++; } });
  const sorted = Object.keys(perDay).sort(), days = new Set(sorted);
  const now = new Date(), T = ymd(now), Y = ymd(addD(now, -1));
  let cur = 0; const base = days.has(T) ? now : days.has(Y) ? addD(now, -1) : null;
  if (base) for (let d = base; days.has(ymd(d)); d = addD(d, -1)) cur++;
  let best = 0, run = 0, prev = null, maxGapRet = 0;
  for (const s of sorted) { const g = prev ? dayDiff(prev, s) : 0; run = g === 1 ? run + 1 : 1; if (g > maxGapRet) maxGapRet = g; best = Math.max(best, run); prev = s; }
  const last = sorted[sorted.length - 1] || null;
  return { papers, toRead: (toRead || []).filter(p => p && p.title), perDay, days, sorted, total: papers.length + extraN,
    T, Y, now, cur, best, last, since: last ? dayDiff(last, T) : null, readToday: days.has(T), maxGapRet };
}
const DEMO_TITLES = ["GeoTransformer", "Predator", "FCGF", "D3Feat", "CoFiNet", "RoITr", "PEAL", "Lepard", "SpinNet", "YOHO", "PointDSC", "SC2-PCR", "MAC", "BUFFER", "RegTR", "TEASER++", "Go-ICP", "FGR", "DGR", "3DMatch", "PointMBF", "DIP", "PPFNet", "Deep Closest Point"];
function demoData(spec) {
  const [n = 12, t = 1, gap = 0, desk = 3] = String(spec).split(",").map(Number);
  let r = 11; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const now = new Date(), papers = [];
  let cur = t ? now : addD(now, -1 - gap);
  for (let i = 0; i < n; i++) {
    papers.push({ title: DEMO_TITLES[i % DEMO_TITLES.length] + (i >= DEMO_TITLES.length ? " v" + Math.floor(i / DEMO_TITLES.length + 1) : ""), date: ymd(cur), pdf: "" });
    if (i % 5 === 3 && rnd() < .5) continue;                       // 偶尔一天读两篇
    cur = addD(cur, -(i < 4 ? 1 : rnd() < .5 ? 1 : 1 + Math.floor(rnd() * 4)));
  }
  return buildData(papers.reverse(), [], DEMO_TITLES.slice(0, desk).map(x => ({ title: x + " (待读)" })));
}
async function loadData() {
  if (Q.has("demo")) return demoData(Q.get("demo") || "12");
  const get = u => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => "");
  const shelf = new URL(DATA_DIR + "Paper_shelf.html", location.href), heat = new URL(DATA_DIR + "Paper_heatmap.html", location.href);
  const [s, h] = await Promise.all([get(shelf.href), get(heat.href)]);
  // PDF 路径是相对书架文件写的（papers/xxx.pdf），这里换算成完整地址
  const fix = arr => arr.map(p => { if (p && p.pdf) try { return { ...p, pdf: new URL(p.pdf, shelf).href }; } catch (e) {} return p; });
  return buildData(fix(grabArr(s, "PAPERS")), grabArr(h, "READ_DATES"), fix(grabArr(s, "TO_READ")));
}
let toastT; function toast(s, ms = 2600) { const t = $("toast"); if (!t) return; t.textContent = s; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); if (!Q.has("demo")) localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* 不用手动修改：自动读取上一级文件夹（仓库根目录）里 Paper_shelf.html 的已读论文。读得越多长得越大，3 天不读就会睡着。 */
const STAGES = [0, 1, 3, 7, 15, 30, 60, 100];
const NAMES = ["月纹鸮蛋", "绒绒雏鸮", "抱书小鸮", "眼镜鸮", "学士鸮", "掌灯鸮", "星冠鸮王", "智慧神鸮"];
const SIZE = {"owl0":[42,62],"owl1":[56,72],"owl2":[78,86],"owl3":[75,104],"owl4":[63,112],"owl5":[130,122],"owl6":[144,134],"owl7":[144,146]};
const SLEEP_DAYS = 3;
(async () => {
  const D = await loadData();
  const n = Q.has("n") ? +Q.get("n") : D.total;
  const since = Q.has("since") ? +Q.get("since") : D.since;
  const cur = Q.has("since") ? (since === 0 ? Math.max(1, D.cur) : since === 1 ? Math.max(1, D.cur) : 0) : D.cur;
  let s = 0; STAGES.forEach((t, i) => { if (n >= t) s = i; });
  const state = n === 0 ? "egg" : since === 0 ? "awake" : since >= SLEEP_DAYS ? "sleep" : since === 2 ? "drowsy" : "idle";
  const root = $("root"); root.classList.add("s" + s, state);
  // 本周阅读
  const now = D.now, mon = addD(now, -((now.getDay() + 6) % 7)); let wn = 0;
  const dots = ["一", "二", "三", "四", "五", "六", "日"].map((w, i) => { const k = ymd(addD(mon, i)), on = D.days.has(k); if (on) wn++;
    return `<span class="dot ${on ? "on" : ""} ${k > D.T ? "fu" : ""} ${k === D.T ? "now" : ""}" style="--i:${i}" title="${k}${on ? " · 已读" : ""}">${w}</span>`; }).join("");
  $("week").innerHTML = `<span class="lb">本周阅读 <b>${wn}</b>/7</span>` + dots;
  // 宠物
  const [w, h] = SIZE["owl" + s], pet = $("pet");
  pet.style.setProperty("--w", w); pet.style.setProperty("--h", h); $("ground").style.setProperty("--gw", Math.round(w * .8) + "px");
  $("sprite").className = "sprite a-owl" + s;
  $("fx").innerHTML = Array.from({ length: 7 }, (_, i) => `<i style="left:${(i * 29 + 9) % 86 + 5}%;top:${(i * 41 + 14) % 60 + 10}%;--du:${2.2 + (i % 3) * .6}s;--dl:${(i * .53) % 2.4}s"></i>`).join("");
  $("nm").textContent = NAMES[s]; $("lv").textContent = "Lv." + (s + 1); $("nread").textContent = n;
  $("streak").innerHTML = `🔥 连续 <b>${cur}</b> 天`;
  const TAG = { egg: "🥚 等待孵化", awake: "✨ 精神抖擞", idle: "🙂 等你读下一篇", drowsy: "🥱 有点困了", sleep: `😴 睡着了 · ${since} 天没读` };
  $("tag").textContent = TAG[state];
  const MOOD = { egg: "读完第一篇论文，它就会破壳", awake: "今天读过了 · 明天也要来哦", idle: "昨天读过，今天也来一篇？", drowsy: "已经 2 天没读论文了", sleep: "读一篇论文就能叫醒它" };
  $("mood").textContent = MOOD[state];
  let pct = 1;
  if (s < STAGES.length - 1) { const a = STAGES[s], b = STAGES[s + 1]; pct = (n - a) / (b - a); $("next").innerHTML = `再读 <b>${b - n}</b> 篇 → ${NAMES[s + 1]}`; }
  else $("next").innerHTML = "已是最终形态 · <b>百篇达成</b>";
  const on = Math.round(pct * 10);
  $("xp").innerHTML = Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? "on" : ""}" style="--i:${i}"></i>`).join("");
  $("chain").innerHTML = STAGES.map((t, k) => `<div class="evo ${k < s ? "done" : k === s ? "cur" : "lock"} ${k === s + 1 ? "nx" : ""}" style="--i:${k}" title="${k <= s ? NAMES[k] : "？？？"} · ${t ? "读满 " + t + " 篇" : "起点"}"><div class="th"><div class="img a-owl${k}"></div></div></div>`).join("");
  // 进化动画：和上次打开时相比长大了
  const prev = store("paper-pet-stage");
  if ((prev !== null && s > prev && !STILL) || Q.has("evolve")) setTimeout(() => { root.classList.add("evolve"); toast(`🎉 进化了！${NAMES[Q.has("evolve") ? Math.max(0, s - 1) : prev]} → ${NAMES[s]}`, 3400); }, 500);
  store("paper-pet-stage", s);
  const LINES = { egg: ["（蛋轻轻晃了晃）", "里面好像有动静……"], awake: ["咕咕！今天的论文好看吗？", s < 7 ? `再读 ${STAGES[s + 1] - n} 篇我就能长大` : "我已经是智慧神鸮了！", "读完记得放上书架"],
    idle: ["咕？今天读哪篇？", "书桌上还有待读的论文呢"], drowsy: ["哈欠……", "再不读我要睡着了……"], sleep: ["Zzz……", "（读一篇论文叫醒它）"] };
  let li = 0;
  pet.addEventListener("click", () => { pet.classList.remove("jump"); void pet.offsetWidth; if (state !== "sleep") pet.classList.add("jump"); const L = LINES[state]; toast(L[li++ % L.length]); });
})();
</script>
