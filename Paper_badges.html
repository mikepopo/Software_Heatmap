<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文成就</title>
<style>
:root{color-scheme:light dark;--ink:#2f3d52;--strong:#273245;--muted:#91a0b6;--line:#dce4ef;--surface:rgba(255,255,255,.96);--chip:#f2f5f9;--chip2:#e6ebf2;
 --t:#12948c;--t2:#0b6f69;--tl:#a9e0d9;--tbg:#e8f6f4;--gold:#d9a521;--warm:#e8590c}
@media(prefers-color-scheme:dark){:root{--ink:#d8dee9;--strong:#f2f5f8;--muted:#9aa7ba;--line:#354255;--surface:rgba(24,29,37,.96);--chip:#273142;--chip2:#323d50;
 --t:#3cc4b8;--t2:#6fdcd1;--tl:#1d5752;--tbg:rgba(60,196,184,.10);--gold:#f0c24b;--warm:#ff8a4c}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:hidden;box-shadow:0 1px 2px rgba(31,45,61,.04)}
.top{display:flex;align-items:center;gap:10px;min-width:0}
h1{margin:0;font-size:18px;font-weight:800;color:var(--strong);white-space:nowrap;letter-spacing:.2px}
.meta{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}.meta b{color:var(--strong);font-size:14px}
.toast{position:absolute;z-index:20;left:50%;top:10px;transform:translate(-50%,-34px);background:var(--strong);color:var(--surface);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transition:all .45s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){h1{font-size:15.5px}.card{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{margin-bottom:10px}
.nextb{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--tbg);margin-bottom:13px;cursor:default}
.nextb .ni{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--tl)}
.nextb .nt{flex:1;min-width:0}
.nextb .l1{font-size:13px;font-weight:700;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextb .l1 b{color:var(--t);font-size:14px}.nextb .l1 em{font-style:normal;color:var(--muted);font-weight:600}
.nextb .br{height:5px;border-radius:3px;background:var(--chip2);margin-top:5px;overflow:hidden}
.nextb .br i{display:block;height:100%;width:0;background:var(--t);border-radius:inherit;transition:width 1.1s cubic-bezier(.3,.9,.3,1) .35s}
.nextb .pc{font-size:12.5px;font-weight:800;color:var(--t);white-space:nowrap}
.nextb.all{background:linear-gradient(90deg,rgba(217,165,33,.16),rgba(217,165,33,.04))}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:11px 6px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;cursor:pointer;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*30ms)}
.md{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;transition:transform .18s}
.bd:hover .md{transform:translateY(-2px) scale(1.05)}
.md .em{position:relative;z-index:2;font-size:23px;line-height:1}
.k-total{--g1:#6fdccf;--g2:#12948c;--gs:rgba(18,148,140,.32)}
.k-streak{--g1:#ffc07a;--g2:#e8590c;--gs:rgba(232,89,12,.28)}
.k-month{--g1:#a9bcff;--g2:#4c6ef5;--gs:rgba(76,110,245,.28)}
.k-special{--g1:#ffe28f;--g2:#d9a521;--gs:rgba(217,165,33,.34)}
.bd.on .md{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--g2),0 4px 10px var(--gs)}
.bd.on .md::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.65) 46%,transparent 60%);background-size:260% 100%;background-position:130% 0;animation:shine 5s ease-in-out infinite;animation-delay:calc(1.2s + var(--i)*.3s)}
.bd.lock .md{background:conic-gradient(var(--t) calc(var(--p)*1%),var(--chip2) 0)}
.bd.lock .md::before{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--chip)}
.bd.lock .em{filter:grayscale(1);opacity:.36}
.bd.hid .em{filter:none;opacity:.45;font-size:19px;font-weight:800;color:var(--muted)}
.nm{margin-top:7px;max-width:100%;font-size:11.5px;font-weight:750;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd.lock .nm{color:var(--muted)}
.cd{margin-top:1px;max-width:100%;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd.on .cd{color:var(--g2)}
@media(prefers-color-scheme:dark){.bd.on .cd{color:var(--g1)}}
.ring{position:absolute;inset:-3px;border-radius:50%;border:2.5px solid var(--g2);opacity:0;pointer-events:none}
.sp{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--g1);opacity:0;pointer-events:none}
.bd.new .md{animation:unlock 1.3s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
.bd.new .ring{animation:ring 1.1s ease-out both;animation-delay:calc(var(--d) + .55s)}
.bd.new .sp{animation:sp .9s ease-out both;animation-delay:calc(var(--d) + .6s)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes shine{0%,72%{background-position:130% 0}100%{background-position:-130% 0}}
@keyframes unlock{0%{transform:scale(.5) rotate(-35deg);filter:grayscale(1) brightness(1.5)}55%{transform:scale(1.25) rotate(8deg);filter:none}100%{transform:none}}
@keyframes ring{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.75);opacity:0}}
@keyframes sp{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-38px) scale(.3);opacity:0}}
@media(max-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>
<body>
<main class="card" id="root">
 <div class="top"><h1>🏅 论文成就</h1><span class="meta" id="meta"></span></div>
 <div class="nextb" id="nextb"></div>
 <div class="grid" id="grid"></div>
 <div class="toast" id="toast"></div>
</main>
<script>
/* ---------- 公共：自动读取同一文件夹里的 Paper_shelf.html（PAPERS、TO_READ）和 Paper_heatmap.html（READ_DATES） ---------- */
const Q = new URLSearchParams(location.search), STILL = Q.has("still");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const isD = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const hashS = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function grabArr(src, name) {
  const m = (src || "").match(new RegExp("const\\s+" + name + "\\s*=\\s*\\[([\\s\\S]*?)\\]\\s*;"));
  if (!m) return [];
  try { return Function("return [" + m[1] + "]")() || []; } catch (e) { return []; }
}
function buildData(papers, extra, toRead) {
  papers = (papers || []).filter(p => p && p.title).map((p, i) => ({ title: String(p.title), date: isD(p.date) ? p.date : "", pdf: p.pdf || "", i }));
  papers.sort((a, b) => (a.date || "0") < (b.date || "0") ? -1 : (a.date || "0") > (b.date || "0") ? 1 : a.i - b.i);
  const perDay = {};
  papers.forEach(p => { if (p.date) perDay[p.date] = (perDay[p.date] || 0) + 1; });
  let extraN = 0;
  (extra || []).forEach(d => { if (isD(d) && !perDay[d]) { perDay[d] = 1; extraN++; } });
  const sorted = Object.keys(perDay).sort(), days = new Set(sorted);
  const now = new Date(), T = ymd(now), Y = ymd(addD(now, -1));
  let cur = 0; const base = days.has(T) ? now : days.has(Y) ? addD(now, -1) : null;
  if (base) for (let d = base; days.has(ymd(d)); d = addD(d, -1)) cur++;
  let best = 0, run = 0, prev = null, maxGapRet = 0;
  for (const s of sorted) { const g = prev ? dayDiff(prev, s) : 0; run = g === 1 ? run + 1 : 1; if (g > maxGapRet) maxGapRet = g; best = Math.max(best, run); prev = s; }
  const last = sorted[sorted.length - 1] || null;
  return { papers, toRead: (toRead || []).filter(p => p && p.title), perDay, days, sorted, total: papers.length + extraN,
    T, Y, now, cur, best, last, since: last ? dayDiff(last, T) : null, readToday: days.has(T), maxGapRet };
}
const DEMO_TITLES = ["GeoTransformer", "Predator", "FCGF", "D3Feat", "CoFiNet", "RoITr", "PEAL", "Lepard", "SpinNet", "YOHO", "PointDSC", "SC2-PCR", "MAC", "BUFFER", "RegTR", "TEASER++", "Go-ICP", "FGR", "DGR", "3DMatch", "PointMBF", "DIP", "PPFNet", "Deep Closest Point"];
function demoData(spec) {
  const [n = 12, t = 1, gap = 0, desk = 3] = String(spec).split(",").map(Number);
  let r = 11; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const now = new Date(), papers = [];
  let cur = t ? now : addD(now, -1 - gap);
  for (let i = 0; i < n; i++) {
    papers.push({ title: DEMO_TITLES[i % DEMO_TITLES.length] + (i >= DEMO_TITLES.length ? " v" + Math.floor(i / DEMO_TITLES.length + 1) : ""), date: ymd(cur), pdf: "" });
    if (i % 5 === 3 && rnd() < .5) continue;                       // 偶尔一天读两篇
    cur = addD(cur, -(i < 4 ? 1 : rnd() < .5 ? 1 : 1 + Math.floor(rnd() * 4)));
  }
  return buildData(papers.reverse(), [], DEMO_TITLES.slice(0, desk).map(x => ({ title: x + " (待读)" })));
}
async function loadData() {
  if (Q.has("demo")) return demoData(Q.get("demo") || "12");
  const get = u => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => "");
  const [s, h] = await Promise.all([get("./Paper_shelf.html"), get("./Paper_heatmap.html")]);
  return buildData(grabArr(s, "PAPERS"), grabArr(h, "READ_DATES"), grabArr(s, "TO_READ"));
}
let toastT; function toast(s, ms = 2600) { const t = $("toast"); if (!t) return; t.textContent = s; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); if (!Q.has("demo")) localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* 不用手动修改：自动读取同一文件夹里 Paper_shelf.html 的已读论文，达成条件就会点亮 */
const BADGES = [
  { id: "t1", k: "total", em: "🌱", nm: "初读", desc: "读完第 1 篇论文", t: 1 },
  { id: "t5", k: "total", em: "📗", nm: "小试牛刀", desc: "累计读完 5 篇", t: 5 },
  { id: "t10", k: "total", em: "📘", nm: "十篇达成", desc: "累计读完 10 篇", t: 10 },
  { id: "t25", k: "total", em: "📚", nm: "博览群文", desc: "累计读完 25 篇", t: 25 },
  { id: "t50", k: "total", em: "🎓", nm: "学富五车", desc: "累计读完 50 篇", t: 50 },
  { id: "t100", k: "total", em: "🏆", nm: "百篇大师", desc: "累计读完 100 篇", t: 100 },
  { id: "s3", k: "streak", em: "🔥", nm: "三日不辍", desc: "连续 3 天读论文", t: 3 },
  { id: "s7", k: "streak", em: "⭐", nm: "七日之约", desc: "连续 7 天读论文", t: 7 },
  { id: "s14", k: "streak", em: "💎", nm: "半月恒心", desc: "连续 14 天读论文", t: 14 },
  { id: "s30", k: "streak", em: "🌕", nm: "月度全勤", desc: "连续 30 天读论文", t: 30 },
  { id: "m5", k: "month", em: "📅", nm: "月读五篇", desc: "一个自然月读完 5 篇", t: 5 },
  { id: "m10", k: "month", em: "🚀", nm: "月读十篇", desc: "一个自然月读完 10 篇", t: 10 },
  { id: "d3", k: "special", v: "day", em: "⚡", nm: "一日三篇", desc: "一天之内读完 3 篇", t: 3 },
  { id: "a30", k: "special", v: "days", em: "👣", nm: "积跬步", desc: "累计 30 天读过论文", t: 30 },
  { id: "we", k: "special", v: "weekend", em: "☕", nm: "周末学者", desc: "累计 10 个周末日读论文", t: 10 },
  { id: "cb", k: "special", v: "comeback", em: "👑", nm: "王者归来", desc: "停读 7 天以上后重新开读", t: 8, hidden: true }
];
const KEY = b => b.v || b.k;
(async () => {
  const D = await loadData();
  // 按时间回放，记录每枚成就第一次达成的日期
  const got = {}; let tot = 0, run = 0, prev = null, nd = 0, wk = 0; const mon = {};
  for (const day of D.sorted) {
    const c = D.perDay[day], g = prev ? dayDiff(prev, day) : 0, mk = day.slice(0, 7), wd = parseD(day).getDay();
    tot += c; nd++; run = g === 1 ? run + 1 : 1; mon[mk] = (mon[mk] || 0) + c; if (wd === 0 || wd === 6) wk++;
    const val = { total: tot, streak: run, month: mon[mk], day: c, days: nd, weekend: wk, comeback: g };
    BADGES.forEach(b => { if (!got[b.id] && val[KEY(b)] >= b.t) got[b.id] = day; });
    prev = day;
  }
  // 当前进度（没解锁的显示进度环）
  const tm = D.T.slice(0, 7), nowV = { total: D.total, streak: D.cur, month: Object.keys(D.perDay).filter(d => d.startsWith(tm)).reduce((a, d) => a + D.perDay[d], 0),
    day: D.perDay[D.T] || 0, days: D.days.size, weekend: [...D.days].filter(d => [0, 6].includes(parseD(d).getDay())).length, comeback: 0 };
  const LEFT = { total: r => `还差 ${r} 篇`, streak: r => `还差 ${r} 天`, month: r => `本月差 ${r} 篇`, day: r => `今天差 ${r} 篇`, days: r => `还差 ${r} 天`, weekend: r => `还差 ${r} 天`, comeback: () => "隐藏成就" };
  const TODO = { total: r => `再读 <b>${r}</b> 篇`, streak: r => `再连续读 <b>${r}</b> 天`, month: r => `本月再读 <b>${r}</b> 篇`, day: r => `今天再读 <b>${r}</b> 篇`, days: r => `再读 <b>${r}</b> 天`, weekend: r => `再读 <b>${r}</b> 个周末日` };
  const info = BADGES.map(b => { const on = !!got[b.id], cv = Math.min(nowV[KEY(b)], b.t), r = Math.max(1, b.t - nowV[KEY(b)]);
    return { ...b, on, date: got[b.id] || "", cv, r, p: on ? 100 : b.hidden ? 0 : Math.round(cv / b.t * 100) }; });
  const nOn = info.filter(b => b.on).length;
  $("meta").innerHTML = `已解锁 <b>${nOn}</b> / ${BADGES.length}`;
  // 新解锁：和上次打开时相比
  const prevIds = store("paper-badges"), onIds = info.filter(b => b.on).map(b => b.id);
  let fresh = Array.isArray(prevIds) && !STILL ? onIds.filter(id => !prevIds.includes(id)) : [];
  if (Q.has("unlock")) fresh = info.filter(b => b.on).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, +Q.get("unlock") || 2).map(b => b.id);
  store("paper-badges", onIds);
  $("grid").innerHTML = info.map((b, i) => { const isNew = fresh.includes(b.id), k = fresh.indexOf(b.id), hid = b.hidden && !b.on;
    const sp = isNew ? Array.from({ length: 8 }, (_, j) => `<i class="sp" style="--a:${j * 45}deg"></i>`).join("") : "";
    return `<div class="bd k-${b.k} ${b.on ? "on" : "lock"} ${hid ? "hid" : ""} ${isNew ? "new" : ""}" data-i="${i}" style="--i:${i};--p:${b.p};--d:${(.45 + k * .55).toFixed(2)}s"
      title="${hid ? "隐藏成就 · 达成后揭晓" : `${b.nm} · ${b.desc}${b.on ? ` · ${b.date} 达成` : ` · 进度 ${b.cv}/${b.t}`}`}">
      <div class="md"><span class="em">${hid ? "?" : b.em}</span><i class="ring"></i>${sp}</div>
      <div class="nm">${hid ? "？？？" : b.nm}</div><div class="cd">${b.on ? b.date.slice(5) + " 达成" : LEFT[KEY(b)](b.r)}</div></div>`; }).join("");
  $("grid").addEventListener("click", e => { const el = e.target.closest(".bd"); if (!el) return; const b = info[+el.dataset.i];
    toast(b.hidden && !b.on ? "🤫 隐藏成就：达成后揭晓" : `${b.em} ${b.nm}：${b.desc}${b.on ? ` · ${b.date} 达成` : ` · ${b.cv}/${b.t}`}`); });
  // 下一枚：进度最高的未解锁成就
  const cand = info.filter(b => !b.on && !b.hidden).sort((a, b) => b.p - a.p || a.r - b.r);
  const nb = $("nextb");
  if (!cand.length) { nb.classList.add("all"); nb.innerHTML = `<div class="ni">🎉</div><div class="nt"><div class="l1">全部成就已解锁！<em>· 你就是论文之神</em></div></div>`; }
  else { const b = cand[0];
    nb.innerHTML = `<div class="ni">${b.em}</div><div class="nt"><div class="l1">下一枚「${b.nm}」· ${TODO[KEY(b)](b.r)} <em>· ${b.desc}</em></div><div class="br"><i id="nbar"></i></div></div><div class="pc">${b.cv}/${b.t}</div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => $("nbar").style.width = Math.max(3, b.p) + "%")); }
  if (fresh.length) setTimeout(() => toast(fresh.length === 1 ? `🎉 解锁新成就：${info.find(b => b.id === fresh[0]).nm}` : `🎉 解锁 ${fresh.length} 枚新成就`, 3200), 900);
})();
</script>
</body></html>
