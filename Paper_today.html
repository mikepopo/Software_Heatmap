<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日打卡</title>
<style>
:root{color-scheme:light dark;--ink:#2f3d52;--strong:#273245;--muted:#91a0b6;--line:#dce4ef;--surface:rgba(255,255,255,.96);--chip:#f2f5f9;--chip2:#e6ebf2;
 --t:#12948c;--t2:#0b6f69;--tl:#a9e0d9;--tbg:#e8f6f4;--gold:#d9a521;--warm:#e8590c}
@media(prefers-color-scheme:dark){:root{--ink:#d8dee9;--strong:#f2f5f8;--muted:#9aa7ba;--line:#354255;--surface:rgba(24,29,37,.96);--chip:#273142;--chip2:#323d50;
 --t:#3cc4b8;--t2:#6fdcd1;--tl:#1d5752;--tbg:rgba(60,196,184,.10);--gold:#f0c24b;--warm:#ff8a4c}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:hidden;box-shadow:0 1px 2px rgba(31,45,61,.04)}
.top{display:flex;align-items:center;gap:10px;min-width:0}
h1{margin:0;font-size:18px;font-weight:800;color:var(--strong);white-space:nowrap;letter-spacing:.2px}
.meta{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}.meta b{color:var(--strong);font-size:14px}
.toast{position:absolute;z-index:20;left:50%;top:10px;transform:translate(-50%,-34px);background:var(--strong);color:var(--surface);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transition:all .45s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){h1{font-size:15.5px}.card{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bar{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.bar::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--wash);opacity:0;animation:wash .8s ease .1s forwards}
@keyframes wash{to{opacity:1}}
.ic{position:relative;flex:0 0 36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--icbg)}
.txt{position:relative;flex:1;min-width:0}
.main{font-size:15px;font-weight:750;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main b{color:var(--acc);font-size:16.5px}
.sub{margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{position:relative;display:flex;gap:5px;flex:0 0 auto}
.wk i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--chip);transition:background .3s}
.wk i.on{background:var(--t);color:#fff}
.wk i.td{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--acc)}
.wk i.fu{opacity:.45}
.done{--acc:var(--t);--icbg:var(--t);--wash:linear-gradient(90deg,var(--tbg),rgba(0,0,0,0) 65%)}
.done .ic{color:#fff;animation:pop .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:none}}
.pending{--acc:var(--warm);--icbg:rgba(255,138,76,.15);--wash:linear-gradient(90deg,rgba(255,138,76,.13),rgba(0,0,0,0) 65%)}
.pending .ic span{display:inline-block;animation:flame 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14,1.2) rotate(3deg)}}
.idle,.none{--acc:var(--t);--icbg:var(--chip);--wash:none}
@media(max-width:560px){.wk i{width:17px;height:17px;font-size:0;border-radius:5px}.wk{gap:3px}.main{font-size:14px}.main b{font-size:15px}.bar{gap:10px;padding:8px 11px}}
@media(max-width:380px){.wk{display:none}}
</style></head>
<body>
<div class="bar" id="bar"><div class="ic" id="ic"></div><div class="txt"><div class="main" id="main"></div><div class="sub" id="sub"></div></div><div class="wk" id="wk"></div></div>
<script>
/* ---------- 公共：自动读取同一文件夹里的 Paper_shelf.html（PAPERS、TO_READ）和 Paper_heatmap.html（READ_DATES） ---------- */
const Q = new URLSearchParams(location.search), STILL = Q.has("still");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const isD = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const hashS = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function grabArr(src, name) {
  const m = (src || "").match(new RegExp("const\\s+" + name + "\\s*=\\s*\\[([\\s\\S]*?)\\]\\s*;"));
  if (!m) return [];
  try { return Function("return [" + m[1] + "]")() || []; } catch (e) { return []; }
}
function buildData(papers, extra, toRead) {
  papers = (papers || []).filter(p => p && p.title).map((p, i) => ({ title: String(p.title), date: isD(p.date) ? p.date : "", pdf: p.pdf || "", i }));
  papers.sort((a, b) => (a.date || "0") < (b.date || "0") ? -1 : (a.date || "0") > (b.date || "0") ? 1 : a.i - b.i);
  const perDay = {};
  papers.forEach(p => { if (p.date) perDay[p.date] = (perDay[p.date] || 0) + 1; });
  let extraN = 0;
  (extra || []).forEach(d => { if (isD(d) && !perDay[d]) { perDay[d] = 1; extraN++; } });
  const sorted = Object.keys(perDay).sort(), days = new Set(sorted);
  const now = new Date(), T = ymd(now), Y = ymd(addD(now, -1));
  let cur = 0; const base = days.has(T) ? now : days.has(Y) ? addD(now, -1) : null;
  if (base) for (let d = base; days.has(ymd(d)); d = addD(d, -1)) cur++;
  let best = 0, run = 0, prev = null, maxGapRet = 0;
  for (const s of sorted) { const g = prev ? dayDiff(prev, s) : 0; run = g === 1 ? run + 1 : 1; if (g > maxGapRet) maxGapRet = g; best = Math.max(best, run); prev = s; }
  const last = sorted[sorted.length - 1] || null;
  return { papers, toRead: (toRead || []).filter(p => p && p.title), perDay, days, sorted, total: papers.length + extraN,
    T, Y, now, cur, best, last, since: last ? dayDiff(last, T) : null, readToday: days.has(T), maxGapRet };
}
const DEMO_TITLES = ["GeoTransformer", "Predator", "FCGF", "D3Feat", "CoFiNet", "RoITr", "PEAL", "Lepard", "SpinNet", "YOHO", "PointDSC", "SC2-PCR", "MAC", "BUFFER", "RegTR", "TEASER++", "Go-ICP", "FGR", "DGR", "3DMatch", "PointMBF", "DIP", "PPFNet", "Deep Closest Point"];
function demoData(spec) {
  const [n = 12, t = 1, gap = 0, desk = 3] = String(spec).split(",").map(Number);
  let r = 11; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const now = new Date(), papers = [];
  let cur = t ? now : addD(now, -1 - gap);
  for (let i = 0; i < n; i++) {
    papers.push({ title: DEMO_TITLES[i % DEMO_TITLES.length] + (i >= DEMO_TITLES.length ? " v" + Math.floor(i / DEMO_TITLES.length + 1) : ""), date: ymd(cur), pdf: "" });
    if (i % 5 === 3 && rnd() < .5) continue;                       // 偶尔一天读两篇
    cur = addD(cur, -(i < 4 ? 1 : rnd() < .5 ? 1 : 1 + Math.floor(rnd() * 4)));
  }
  return buildData(papers.reverse(), [], DEMO_TITLES.slice(0, desk).map(x => ({ title: x + " (待读)" })));
}
async function loadData() {
  if (Q.has("demo")) return demoData(Q.get("demo") || "12");
  const get = u => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => "");
  const [s, h] = await Promise.all([get("./Paper_shelf.html"), get("./Paper_heatmap.html")]);
  return buildData(grabArr(s, "PAPERS"), grabArr(h, "READ_DATES"), grabArr(s, "TO_READ"));
}
let toastT; function toast(s, ms = 2600) { const t = $("toast"); if (!t) return; t.textContent = s; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); if (!Q.has("demo")) localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* 不用手动修改：自动读取同一文件夹里 Paper_shelf.html 和 Paper_heatmap.html 的阅读日期 */
(async () => {
  const D = await loadData(), now = D.now;
  const todayN = D.perDay[D.T] || 0, bar = $("bar");
  let st, ic, main, sub;
  if (D.readToday) {
    st = "done"; ic = "✓";
    main = `今天已读 <b>${todayN}</b> 篇 · 已连续 <b>${D.cur}</b> 天`;
    const lastP = [...D.papers].reverse().find(p => p.date === D.T);
    sub = (D.cur >= 2 && D.cur >= D.best ? "🏆 正在刷新最长连续纪录 · " : "") + (lastP ? `刚读完《${esc(lastP.title)}》` : "明天继续保持");
  } else if (D.cur > 0) {
    st = "pending"; ic = "<span>🔥</span>";
    main = `今天还没读 · 已连续 <b>${D.cur}</b> 天，别断了`;
    sub = "";
  } else if (D.last) {
    st = "idle"; ic = "🌙";
    main = `今天还没读 · 上次阅读是 <b>${D.since}</b> 天前`;
    sub = D.best ? `最长连续纪录 ${D.best} 天 · 今天读一篇，重新点燃` : "今天读一篇，重新点燃";
  } else { st = "none"; ic = "📖"; main = "读完第一篇论文，开始打卡"; sub = "读完放上书架，这里就会亮起来"; }
  bar.classList.add(st); $("ic").innerHTML = ic; $("main").innerHTML = main; $("sub").innerHTML = sub;
  const tick = () => { if (st !== "pending") return; const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), m = Math.max(0, Math.round((end - new Date()) / 6e4));
    $("sub").textContent = `距离今天结束还有 ${Math.floor(m / 60)} 小时 ${m % 60} 分 · 读一篇就能续上`; };
  tick(); setInterval(tick, 30000);
  const mon = addD(now, -((now.getDay() + 6) % 7));
  $("wk").innerHTML = ["一", "二", "三", "四", "五", "六", "日"].map((w, i) => { const d = addD(mon, i), k = ymd(d);
    return `<i class="${D.days.has(k) ? "on" : ""} ${k === D.T ? "td" : ""} ${k > D.T ? "fu" : ""}" title="周${w} ${k}${D.days.has(k) ? " · 已读" : ""}">${w}</i>`; }).join("");
})();
</script>
</body></html>
