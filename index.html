<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Software学习打卡记录</title>
<style>
:root{color-scheme:light dark;--ink:#2f3d52;--strong:#273245;--muted:#91a0b6;--line:#dce4ef;--surface:rgba(255,255,255,.96);--picker:#f2f5f9;--today:#243244;--empty-cell:#eef2f6;--partial-cell:#ace7ae;--done-cell:#2f7d32;--cell:12px;--gap:4px}
@media(prefers-color-scheme:dark){:root{--ink:#d8dee9;--strong:#f2f5f8;--muted:#9aa7ba;--line:#354255;--surface:rgba(24,29,37,.96);--picker:#273142;--today:#f2f5f8;--empty-cell:#293344;--partial-cell:#4d995b;--done-cell:#74cb7a}}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;max-width:100%;min-height:0;background:transparent;overflow:hidden}body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card{width:100%;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 2px rgba(31,45,61,.04);padding:20px 12px 14px;overflow:hidden;container-type:inline-size}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;width:100%}h1{margin:0;font-size:clamp(18px,2.4cqw,25px);line-height:1.15;letter-spacing:0;color:var(--strong);font-weight:750}
.picker{position:relative;display:inline-flex;flex:0 0 auto;align-items:center;gap:6px;height:32px;padding:0 9px 0 10px;border-radius:8px;background:var(--picker);border:1px solid transparent;color:var(--muted)}.picker:focus-within{border-color:#cbd6e4;box-shadow:0 0 0 2px rgba(143,160,184,.16)}.picker select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;color:var(--muted);font-size:clamp(11px,1.25cqw,13px);font-weight:600;cursor:pointer;padding:0 13px 0 0;max-width:100px}.picker select option{color:var(--strong)}.calendar-icon{width:16px;height:16px;color:var(--strong);pointer-events:none;flex:0 0 auto}.calendar-icon svg{width:16px;height:16px;fill:currentColor;display:block}
.stats-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:clamp(11px,1.35cqw,14px);line-height:1.25;color:var(--ink);font-variant-numeric:tabular-nums}.stat-item{display:inline-flex;align-items:center;gap:5px;font-weight:400;color:var(--strong);white-space:nowrap}.stat-icon{width:16px;height:16px;color:currentColor;flex:0 0 auto}.stat-icon svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.separator{display:inline-flex;align-items:center;justify-content:center;width:12px;height:16px;color:var(--muted);opacity:.85;flex:0 0 auto}.separator svg{width:12px;height:12px;display:block;fill:currentColor}
.heatmap-wrap{margin-top:17px;width:100%;overflow:hidden;--scale:calc(100cqw / var(--grid-width));height:calc(var(--base-height) * var(--scale))}.heatmap{display:grid;grid-template-columns:46px repeat(var(--week-count),var(--cell));grid-template-rows:20px repeat(7,var(--cell));gap:var(--gap);width:var(--grid-width);transform:scale(var(--scale));transform-origin:top left;align-items:center}.month-label{color:var(--ink);font-size:13px;text-align:left;white-space:nowrap;align-self:end;line-height:1.1}.weekday{color:var(--ink);font-size:13px;text-align:right;padding-right:7px;white-space:nowrap;line-height:1}.day-cell{width:var(--cell);height:var(--cell);border-radius:3px;background:var(--empty-cell);box-shadow:inset 0 0 0 1px rgba(47,61,82,.04)}.day-cell.is-partial{background:var(--partial-cell)!important}.day-cell.is-complete{background:var(--done-cell)!important}.day-cell.is-today{outline:2px solid var(--today);outline-offset:1px}
@media(max-width:540px){.card{padding:20px 8px 12px}.topbar{gap:7px}.picker{height:29px;padding-inline:6px}.picker select{max-width:76px}.stats-row{gap:4px}}
</style></head>
<body><main class="card">
<div class="topbar"><h1>Software学习打卡记录</h1><label class="picker" aria-label="按年份筛选"><select id="year-picker" aria-label="选择年份"></select><span class="calendar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1.5A2.5 2.5 0 0 1 22 6.5v12A2.5 2.5 0 0 1 19.5 21h-15A2.5 2.5 0 0 1 2 18.5v-12A2.5 2.5 0 0 1 4.5 4H6V3a1 1 0 0 1 1-1Zm12.5 8h-15v8.5a.5.5 0 0 0 .5.5h14a.5.5 0 0 0 .5-.5V10ZM5 6a.5.5 0 0 0-.5.5V8h15V6.5A.5.5 0 0 0 19 6H5Z"/></svg></span></label></div>
<div class="stats-row" aria-live="polite"><span class="stat-item"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span>学习 <strong id="reading-days">0</strong> 天</span></span><span class="separator" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/></svg></span><span class="stat-item"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"></path></svg></span><span>最长连续 <strong id="longest-streak">0</strong> 天</span></span></div>
<div class="heatmap-wrap" id="heatmap-wrap"><div class="heatmap" id="heatmap" aria-label="年度Software学习热力图"></div></div>
</main>
<script>
/* 由每日打卡维护这两个数组。日期格式 YYYY-MM-DD；更新时必须保留已有日期。 */
const COMPLETED_DATES = ["2026-10-17", "2026-10-18", "2026-10-19", "2026-10-21", "2026-10-22", "2026-10-23", "2026-10-24", "2026-10-25", "2026-10-26", "2026-10-27"];
const PARTIAL_DATES = [];
(()=>{
 const CELL=12,GAP=4,LABEL_WIDTH=46,TOP_ROW_HEIGHT=20,FIRST_YEAR=2020,LAST_YEAR=2035;
 const done=new Set(COMPLETED_DATES),partial=new Set(PARTIAL_DATES),$=id=>document.getElementById(id);
 const pad=n=>String(n).padStart(2,'0'),toISO=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
 const dayIndex=d=>(d.getUTCDay()+6)%7,utcDate=(y,m,d)=>new Date(Date.UTC(y,m,d)),now=new Date(),currentYear=now.getFullYear();
 for(let y=LAST_YEAR;y>=FIRST_YEAR;y--){const o=document.createElement('option');o.value=String(y);o.textContent=y+' 年';if(y===currentYear)o.selected=true;$('year-picker').appendChild(o)}
 if(currentYear<FIRST_YEAR||currentYear>LAST_YEAR){const o=document.createElement('option');o.value=String(currentYear);o.textContent=currentYear+' 年';o.selected=true;$('year-picker').appendChild(o)}
 function renderYear(year){
  const jan1=utcDate(year,0,1),first=utcDate(year,0,1-dayIndex(jan1)),dec31=utcDate(year,11,31),last=utcDate(year,11,31+(6-dayIndex(dec31)));
  const weeks=Math.round((last-first)/604800000)+1,gridWidth=LABEL_WIDTH+weeks*(CELL+GAP),gridHeight=TOP_ROW_HEIGHT+7*(CELL+GAP),map=$('heatmap');map.innerHTML='';
  [['--week-count',weeks],['--cell',CELL+'px'],['--gap',GAP+'px'],['--grid-width',gridWidth+'px'],['--base-height',gridHeight+'px']].forEach(([k,v])=>map.style.setProperty(k,String(v)));
  $('heatmap-wrap').style.setProperty('--grid-width',gridWidth+'px');$('heatmap-wrap').style.setProperty('--base-height',gridHeight+'px');map.setAttribute('aria-label',year+' 年Software学习热力图');
  for(let month=0;month<12;month++){const date=utcDate(year,month,1),week=Math.floor((date-first)/604800000),label=document.createElement('div');label.className='month-label';label.textContent=(month+1)+'月';label.style.gridColumn=String(week+2);label.style.gridRow='1';map.appendChild(label)}
  [['周一',2],['周三',4],['周五',6]].forEach(([text,row])=>{const label=document.createElement('div');label.className='weekday';label.textContent=text;label.style.gridColumn='1';label.style.gridRow=String(row);map.appendChild(label)});
  let total=0,longest=0,streak=0;
  for(let d=utcDate(year,0,1);d<=utcDate(year,11,31);d.setUTCDate(d.getUTCDate()+1)){const key=toISO(d);if(done.has(key)){total++;streak++;longest=Math.max(longest,streak)}else streak=0}
  const today=toISO(utcDate(now.getFullYear(),now.getMonth(),now.getDate()));
  for(let i=0;i<weeks*7;i++){const date=new Date(first);date.setUTCDate(first.getUTCDate()+i);const key=toISO(date),week=Math.floor(i/7),row=dayIndex(date)+2,inYear=date.getUTCFullYear()===year,cell=document.createElement('div');cell.className='day-cell';cell.style.gridColumn=String(week+2);cell.style.gridRow=String(row);cell.title=key;
   if(!inYear){cell.setAttribute('aria-label',key+'（年度外）')}else if(done.has(key)){cell.classList.add('is-complete');cell.title=key+' · 已完成';cell.setAttribute('aria-label',key+'，已完成')}else if(partial.has(key)){cell.classList.add('is-partial');cell.title=key+' · 部分完成';cell.setAttribute('aria-label',key+'，部分完成')}else cell.setAttribute('aria-label',key+'，未打卡');
   if(key===today)cell.classList.add('is-today');map.appendChild(cell)}
  $('reading-days').textContent=String(total);$('longest-streak').textContent=String(longest);
 }
 $('year-picker').addEventListener('change',e=>renderYear(Number(e.target.value)));renderYear(Number($('year-picker').value||currentYear));
})();
</script></body></html>
