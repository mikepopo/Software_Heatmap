<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>完成趋势 · 每日清单</title>
<link rel="stylesheet" href="checklist-widgets.css">
<script src="checklist-widgets.js" defer></script>
</head>
<body data-panel="trend">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-brand" viewBox="0 0 24 24"><path d="m3 7 2 2 4-4m3 2h8M3 15l2 2 4-4m3 2h8"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 4v4m8-4v4M4 11h16"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-backup" viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-checklist" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="m8 10 1.5 1.5 3-3M13 11h3m-8 5h8"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c2-6 6-9 12-12M6 16c-2-6 3-10 13-11 0 9-4 14-11 13"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m5 16-1 4 4-1L19 8l-3-3L5 16Zm9-9 3 3"/></symbol>
  <symbol id="i-analytics" viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 4 2 4-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14m-9-3h4m-7 3 1 12h8l1-12m-7 3v6m4-6v6"/></symbol>
</svg>
<main class="shell">
  <noscript><p class="warning">请在支持 JavaScript 的浏览器中打开。</p></noscript>
  <p class="warning" id="storage-warning" role="alert" hidden></p>
  <section id="trend" class="card trend-card" aria-labelledby="trend-heading">
    <div class="card-header trend-header">
      <div class="card-heading"><span class="card-icon"><svg class="icon" aria-hidden="true"><use href="#i-analytics"/></svg></span><h2 id="trend-heading">完成趋势</h2></div>
      <div class="range" role="group" aria-label="趋势统计范围">
        <button type="button" data-range-option="7" aria-pressed="true">近 7 天</button>
        <button type="button" data-range-option="30" aria-pressed="false">近 30 天</button>
      </div>
    </div>
    <div class="trend-metrics">
      <div class="metric"><span>已完成任务</span><strong><span class="metric-value" id="range-done">0</span><small>项</small></strong></div>
      <div class="metric"><span>待完成任务</span><strong><span class="metric-value" id="range-open">0</span><small>项</small></strong></div>
      <div class="metric"><span>总体完成率</span><strong id="range-rate">—</strong></div>
      <div class="metric"><span>有完成记录</span><strong><span class="metric-value" id="range-active">0</span><small>天</small></strong></div>
    </div>
    <div class="chart-header">
      <span class="chart-range" id="range-label"></span>
      <div class="chart-legend" aria-label="图例"><span><i aria-hidden="true"></i>已完成</span><span><i class="open" aria-hidden="true"></i>待完成</span></div>
    </div>
    <div class="chart-scroll">
      <div class="chart" id="trend-chart" data-range="7">
        <div class="chart-axis" aria-hidden="true"><span id="chart-max">2</span><span id="chart-mid">1</span><span>0</span></div>
        <div class="chart-columns" id="chart-columns" role="group" aria-label="每日任务柱状图，选择日期可查看当天清单"></div>
        <p class="chart-empty" id="chart-empty">这段时间还没有任务。</p>
      </div>
    </div>
    <p class="chart-selection note" id="chart-selection">点击某一天的柱子，查看当天任务。</p>
  </section>
</main>
<div class="sr-only" id="announce" role="status"></div>

</body>
</html>
